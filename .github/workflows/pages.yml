name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The daily catalog sync commits data.js using the default GITHUB_TOKEN, whose
  # pushes do NOT trigger the `push` event above (GitHub blocks that to avoid
  # workflow loops). So deploy explicitly once the sync workflow finishes,
  # otherwise catalog updates sit un-deployed until a human pushes.
  workflow_run:
    workflows: ["Sync catalog from shop.koope.de"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment
