<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koope – Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #86868b;
      --border: #e8e8ed;
      --accent: #0071e3;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: #2c2c2e;
        --text: #f5f5f7;
        --muted: #98989d;
        --border: #3a3a3c;
        --accent: #0a84ff;
        --shadow: 0 1px 4px rgba(0,0,0,0.3);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container { width: 100%; max-width: 360px; }

    header { margin-bottom: 28px; }
    .header-logo { display: flex; align-items: center; gap: 13px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
    .subtitle { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title { font-size: 15px; font-weight: 600; }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      touch-action: manipulation;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button:not(:disabled):hover { opacity: 0.88; }

    .hint { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }
    .hint.error { color: #ff3b30; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-logo">
      <svg viewBox="0 0 40 46" fill="none" aria-hidden="true" style="width:40px;height:46px;flex-shrink:0">
        <rect x="3" y="18" width="34" height="26" rx="4" fill="var(--accent)" fill-opacity="0.13" stroke="var(--accent)" stroke-width="2"/>
        <path d="M14 18C14 9 26 9 26 18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="3" y1="26" x2="37" y2="26" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.25"/>
        <path d="M17 15C16 11 20 9 20 13" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round"/>
        <path d="M23 14C24 10 20 9 21 13" stroke="#34c759" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Koope</h1>
        <p class="subtitle">Leipzig Food Co-op</p>
      </div>
    </div>
  </header>

  <div class="card">
    <p class="card-title">Sign in to your list</p>
    <input type="text" id="username" placeholder="Username" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="go-btn" onclick="signIn()">Open my list</button>
    <p class="hint" id="hint">New here? Pick a username and password — your account is created automatically.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://yxkkseauqoiemyswknsx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xQZU1Hvm5eOzNSaZE8wL1w_7YObMr-M';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function showHint(msg, isError) {
    const h = document.getElementById('hint');
    h.textContent = msg;
    h.className = 'hint' + (isError ? ' error' : '');
  }

  function setLoading(v) {
    const btn = document.getElementById('go-btn');
    btn.disabled = v;
    btn.textContent = v ? 'Opening…' : 'Open my list';
  }

  // Auto-login if valid cached credentials
  (async () => {
    const cached = JSON.parse(localStorage.getItem('koope-auth') || 'null');
    if (!cached?.username || !cached?.hash) return;
    const { data } = await db.from('users').select('password_hash').eq('username', cached.username).single();
    if (data?.password_hash === cached.hash) {
      window.location.replace('koope_einkaufszettel.html');
    } else {
      localStorage.removeItem('koope-auth');
    }
  })();

  async function signIn() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username) { showHint('Enter a username.', true); return; }
    if (!password)  { showHint('Enter a password.', true); return; }

    setLoading(true);
    const hash = await sha256(password);

    const { data: existing } = await db.from('users').select('password_hash').eq('username', username).single();

    if (!existing) {
      const { error } = await db.from('users').insert({ username, password_hash: hash });
      if (error) { showHint('Could not create account. Try again.', true); setLoading(false); return; }
    } else if (existing.password_hash !== hash) {
      showHint('Wrong password.', true);
      setLoading(false);
      return;
    }

    localStorage.setItem('koope-auth', JSON.stringify({ username, hash }));
    window.location.replace('koope_einkaufszettel.html');
  }

  // Pre-fill username from last session
  const lastUser = JSON.parse(localStorage.getItem('koope-auth') || 'null');
  if (lastUser?.username) document.getElementById('username').value = lastUser.username;

  document.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
</script>
</body>
</html>
